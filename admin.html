<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Escape Room</title>
    <style>
      :root {
        --bg-color: #0d1117;
        --text-color: #00ff00;
        --error-color: #ff003c;
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: "Courier New", Courier, monospace;
        padding: 20px;
        margin: 0;
      }
      h1 { 
        text-align: center; 
        text-transform: uppercase; 
        letter-spacing: 2px;
        border-bottom: 2px solid var(--text-color);
        padding-bottom: 10px;
        text-shadow: 0 0 10px var(--text-color);
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background: rgba(0, 0, 0, 0.5);
      }
      th, td {
        border: 1px solid var(--text-color);
        padding: 12px;
        text-align: left;
      }
      th { 
        background-color: rgba(0, 255, 0, 0.1); 
        text-transform: uppercase;
      }
      .actions { 
        margin-top: 30px; 
        text-align: center; 
      }
      button, a.btn {
        background: transparent;
        color: var(--text-color);
        border: 1px solid var(--text-color);
        padding: 12px 24px;
        font-family: inherit;
        font-size: 16px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        margin: 0 10px;
        text-transform: uppercase;
        font-weight: bold;
        transition: all 0.2s;
      }
      button:hover, a.btn:hover {
        background: var(--text-color);
        color: var(--bg-color);
        box-shadow: 0 0 15px var(--text-color);
      }
      /* CRT Scanline Effect */
      .crt::before {
        content: " ";
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        z-index: 9999;
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
      }
    </style>
  </head>
  <body class="crt">
    <div class="container">
      <h1>System Override - Admin Dashboard</h1>
      
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Status</th>
            <th>Current Node</th>
            <th>Score</th>
            <th>Time Left</th>
          </tr>
        </thead>
        <tbody id="student-table">
          <tr><td colspan="5" style="text-align: center;">Waiting for incoming connections...</td></tr>
        </tbody>
      </table>

      <div class="actions">
        <a href="answers" class="btn" download="answers.txt">Download Answer Key</a>
        <a href="javascript:void(0)" onclick="exportData()" class="btn">Export Student Data</a>
        <a href="index.html" class="btn">Back to Login</a>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
      const socket = io();
      
      socket.on('admin_update', function(students) {
        const tbody = document.getElementById('student-table');
        if (students.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Waiting for incoming connections...</td></tr>';
            return;
        }
        tbody.innerHTML = '';
        students.forEach(student => {
          const row = document.createElement('tr');
          let statusColor = "var(--text-color)";
          if (student.status === "Disconnected") statusColor = "#888";
          if (student.status === "Game Over") statusColor = "var(--error-color)";
          
          row.style.color = statusColor;
          row.innerHTML = `
            <td><strong>${student.name}</strong></td>
            <td>${student.status}</td>
            <td>${student.room}</td>
            <td>${student.score}</td>
            <td>${student.time_left}</td>
          `;
          tbody.appendChild(row);
        });
      });

      function exportData() {
          fetch('/export_students').then(res => {
              if (res.ok) {
                  window.location.href = '/export_students';
              } else {
                  alert('Exporting student data requires the Python backend server to be running. This feature is not available on simple static hosting.');
              }
          }).catch(err => {
              alert('Exporting student data requires the Python backend server to be running. This feature is not available on simple static hosting.');
          });
      }
    </script>
  </body>
</html>
